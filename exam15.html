    <script>
        $(document).ready(function() {
            $("p").hover(function() {
                $("this").css('color', 'red');
            }, function() {
                $("this").css('color', 'black');
            });
            $('a').click(function(e) {
                e.preventDefault();
                location.href = 'https://www.naver.com';
        });
        });
    </script>
