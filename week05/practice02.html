<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name ="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>My Schedule</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Gugi&display=swap" rel="stylesheet">
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                padding: 60px 20px;
                color: #273248;
                font-family: "Malgun Gothic", sans-serif;
                background-color: #f4f7fb;
                background-image: linear-gradient(135deg, #f4f7fb 0%, #e4edf7 100%);
            }

            .schedule-wrap {
                width: min(100%, 900px);
                margin: 0 auto;
                padding: 36px;
                border: 1px solid #d8e0eb;
                border-radius: 18px;
                background-color: rgba(255, 255, 255, 0.9);
                box-shadow: 0 18px 45px rgba(57, 76, 103, 0.14);
            }

            h1 {
                margin: 0 0 8px;
                color: #234e70;
                font-family: "Gugi", sans-serif;
                font-size: 32px;
                font-weight: 400;
                text-align: center;
            }

            .description {
                margin: 0 0 28px;
                color: #748196;
                font-size: 14px;
                text-align: center;
            }

            table {
                width: 100%;
                table-layout: fixed;
                border-collapse: collapse;
                overflow: hidden;
                border: 2px solid #587898;
                border-radius: 10px;
                background-color: #ffffff;
            }

            caption {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
            }

            th,
            td {
                height: 58px;
                padding: 10px 8px;
                text-align: center;
                vertical-align: middle;
                overflow-wrap: break-word;
                border: 1px solid #d7e0ea;
            }

            thead th {
                height: 52px;
                color: #ffffff;
                font-size: 16px;
                background-color: #587898;
            }

            thead th:first-child {
                color: #dcebf5;
                background-color: #3f607e;
            }

            tbody td:first-child,
            tfoot td:first-child {
                color: #52677d;
                font-size: 13px;
                font-weight: bold;
                background-color: #edf3f8;
            }

            tbody td:not(:first-child),
            tfoot td:not(:first-child) {
                color: #33465c;
                font-size: 14px;
                background-color: #fbfdff;
                transition: background-color 0.2s, transform 0.2s;
            }

            tbody td:not(:first-child):hover,
            tfoot td:not(:first-child):hover {
                background-color: #e4f2f4;
                transform: scale(1.03);
            }

            tbody td:nth-child(2),
            tfoot td:nth-child(2) {
                background-color: #fff8e8;
            }

            tbody td:nth-child(3),
            tfoot td:nth-child(3) {
                background-color: #eef7ff;
            }

            tbody td:nth-child(4),
            tfoot td:nth-child(4) {
                background-color: #f3efff;
            }

            tbody td:nth-child(5),
            tfoot td:nth-child(5) {
                background-color: #edfaf3;
            }

            tbody td:nth-child(6),
            tfoot td:nth-child(6) {
                background-color: #fff0f0;
            }

            @media (max-width: 640px) {
                body {
                    padding: 28px 10px;
                }

                .schedule-wrap {
                    padding: 24px 10px;
                }

                h1 {
                    font-size: 26px;
                }

                th,
                td {
                    height: 64px;
                    padding: 6px 3px;
                    font-size: 12px;
                }

                thead th,
                tbody td:not(:first-child),
                tfoot td:not(:first-child) {
                    font-size: 12px;
                }
            }
        </style>
    </head>
    <body>
